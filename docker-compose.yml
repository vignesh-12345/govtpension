services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: sewasetu123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploying}
      # PUBLIC_BASE_URL must be the externally reachable URL (https://...) so that:
      #   - OAuth tokens are minted with the correct issuer/audience
      #   - MCP clients can discover the portal at /.well-known/oauth-authorization-server
      # Set in your .env file or pass on the command line:
      #   PUBLIC_BASE_URL=https://sewasetu.yourdomain.com docker compose up -d
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SECRET_KEY: ${SECRET_KEY:-ssp-prod-key-change-me}
    depends_on:
      - db
      - smsgw
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  scheduler:
    build: ./app
    restart: unless-stopped
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      - db
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    restart: unless-stopped
    expose:
      - "8025"

volumes:
  pgdata:
  uploads:
  applogs:
